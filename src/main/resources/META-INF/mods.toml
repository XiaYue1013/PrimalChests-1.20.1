displayName="${mod_name}"
credits="Original mod by Jared (jaredlll08): https://github.com/jaredlll08/PrimalChests . This is an unofficial Forge 1.20.1 port of PrimalChests 1.0.3 (1.12.2), not made or endorsed by the original author; do not report problems with this port to the original author. Licensed under LGPL-2.1."
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
