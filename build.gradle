plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

group = mod_group_id
version = "${minecraft_version}-${mod_version}"

base {
    archivesName = 'PrimalChests'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    // LGPL-2.1: ship the corresponding source next to the binary jar
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // -PvisualTest=true: builds a test scene, takes screenshots into run/screenshots and quits (dev only)
            property 'primalchests.visualTest', project.findProperty('visualTest') ?: 'false'
            if (project.findProperty('visualTest') == 'true')
                args '--width', '1280', '--height', '720'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            // -PserverSmokeTest=true: the server stops itself after 200 ticks (dev only)
            property 'primalchests.serverSmokeTest', project.findProperty('serverSmokeTest') ?: 'false'
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    mavenCentral()
    maven {
        // JEI (dev only: -PwithJei=true runs the client with it; the mod itself has no JEI code)
        name = "BlameJared Maven"
        url = "https://maven.blamejared.com/"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Only the dev screenshot helper (dev/JeiShots, excluded from the jar) uses JEI
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    if (project.findProperty('withJei') == 'true') {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // Development test tools only
    exclude 'com/blamejared/primalchests/dev/**'
    exclude 'com/blamejared/primalchests/gametest/**'
    exclude 'data/primalchests/structures/**'
    from('LICENSE') {
        rename { "LICENSE_${mod_id}" }
    }
    from('NOTICE.md') {
        rename { "NOTICE_${mod_id}.md" }
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'jaredlll08',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'Unofficial Forge 1.20.1 port of PrimalChests by jaredlll08',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('sourcesJar', Jar).configure {
    from('LICENSE') {
        rename { "LICENSE_${mod_id}" }
    }
    from('NOTICE.md') {
        rename { "NOTICE_${mod_id}.md" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
